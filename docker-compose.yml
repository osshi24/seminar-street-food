services:
  postgres:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: seminar_postgres
    environment:
      POSTGRES_DB: seminar_db
      POSTGRES_USER: seminar_user
      POSTGRES_PASSWORD: seminar_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seminar_user -d seminar_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seminar_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: seminar_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: seminar_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/seminar-media;
      mc anonymous set download local/seminar-media;
      exit 0;
      "

  umami_postgres:
    image: postgres:15-alpine
    container_name: seminar_umami_postgres
    environment:
      POSTGRES_DB: umami_db
      POSTGRES_USER: umami_user
      POSTGRES_PASSWORD: umami_pass
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami_user -d umami_db']
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: seminar_umami
    ports:
      - '3002:3000'
    environment:
      DATABASE_URL: postgresql://umami_user:umami_pass@umami_postgres:5432/umami_db
      DATABASE_TYPE: postgresql
      APP_SECRET: seminar-umami-secret-change-in-production
      DISABLE_TELEMETRY: 1
      DISABLE_UPDATE_CHECK: 1
    depends_on:
      umami_postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  umami_postgres_data:
